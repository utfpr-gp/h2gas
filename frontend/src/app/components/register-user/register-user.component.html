<div class="min-h-screen bg-gray-50">
  <header class="bg-primary text-white px-4 pt-10 pb-24 text-center">
    <img src="../assets/logo-h2.png" alt="H2Gás" class="w-28 mx-auto drop-shadow-lg" />
    <p class="text-sm text-white/90 max-w-xs mx-auto mt-3">
      A energia e a hidratação que movem o seu dia, a um clique de distância.
    </p>
  </header>

  <main class="px-4 -mt-16 pb-12">
    <section class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-xl mx-auto p-6">
      <!-- Seletor de perfil (Figura 10c) -->
      <div *ngIf="allowProfileChoice" class="grid grid-cols-2 gap-2 bg-gray-100 rounded-xl p-1 mb-5">
        <button type="button" data-testid="profile-customer" (click)="selectProfile('CUSTOMER')"
          class="rounded-lg py-2 text-sm font-semibold transition"
          [ngClass]="userType === 'CUSTOMER' ? 'bg-white text-primary shadow' : 'text-gray-600'">
          Sou cliente
        </button>
        <button type="button" data-testid="profile-supplier" (click)="selectProfile('SUPPLIER')"
          class="rounded-lg py-2 text-sm font-semibold transition"
          [ngClass]="userType === 'SUPPLIER' ? 'bg-white text-primary shadow' : 'text-gray-600'">
          Sou fornecedor
        </button>
      </div>

      <h1 class="text-xl font-bold text-gray-800">{{ tittleRegister || 'Crie sua conta' }}</h1>
      <p class="text-sm text-gray-500">Preencha seus dados para começar a usar a plataforma</p>

      <form [formGroup]="registerForm" (ngSubmit)="register()" class="mt-5 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block sm:col-span-2">
            <span class="text-sm font-medium text-gray-700">
              {{ userType === 'SUPPLIER' ? 'Nome da sua empresa' : 'Nome completo' }}
            </span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">person</span>
              <input type="text" formControlName="name"
                [placeholder]="userType === 'SUPPLIER' ? 'Nome da empresa' : 'Seu nome completo'"
                class="input w-full rounded-xl border bg-white pl-10"
                [ngClass]="isInvalid('name') ? 'border-red-400' : 'border-gray-300'" />
            </span>
            <span *ngIf="isInvalid('name')" class="text-red-500 text-sm">{{ getErrorMessage('name') }}</span>
          </label>

          <label class="block sm:col-span-2">
            <span class="text-sm font-medium text-gray-700">E-mail</span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">mail</span>
              <input type="email" formControlName="email" placeholder="seu@email.com"
                class="input w-full rounded-xl border bg-white pl-10"
                [ngClass]="isInvalid('email') ? 'border-red-400' : 'border-gray-300'" />
            </span>
            <span *ngIf="isInvalid('email')" class="text-red-500 text-sm">{{ getErrorMessage('email') }}</span>
          </label>

          <label class="block" [class.sm:col-span-2]="userType !== 'SUPPLIER'">
            <span class="text-sm font-medium text-gray-700">Telefone</span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">call</span>
              <input type="tel" mask="(00) 00000-0000" formControlName="phoneNumber" placeholder="(00) 00000-0000"
                class="input w-full rounded-xl border bg-white pl-10"
                [ngClass]="isInvalid('phoneNumber') ? 'border-red-400' : 'border-gray-300'" />
            </span>
            <span *ngIf="isInvalid('phoneNumber')" class="text-red-500 text-sm">{{ getErrorMessage('phoneNumber') }}</span>
          </label>

          <label *ngIf="userType === 'SUPPLIER'" class="block">
            <span class="text-sm font-medium text-gray-700">CNPJ</span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">badge</span>
              <input type="text" mask="00.000.000/0000-00" formControlName="cnpj" placeholder="00.000.000/0000-00"
                class="input w-full rounded-xl border border-gray-300 bg-white pl-10" />
            </span>
          </label>

          <label class="block">
            <span class="text-sm font-medium text-gray-700">Senha</span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">lock</span>
              <input type="password" formControlName="password" placeholder="Mínimo de 6 caracteres"
                class="input w-full rounded-xl border bg-white pl-10"
                [ngClass]="isInvalid('password') ? 'border-red-400' : 'border-gray-300'" />
            </span>
            <span *ngIf="isInvalid('password')" class="text-red-500 text-sm">{{ getErrorMessage('password') }}</span>
          </label>

          <label class="block">
            <span class="text-sm font-medium text-gray-700">Confirmar senha</span>
            <span class="relative mt-1 block">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">lock</span>
              <input type="password" placeholder="Repita a senha" required [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="confirmPassword" class="input w-full rounded-xl border border-gray-300 bg-white pl-10" />
            </span>
          </label>
        </div>

        <button type="submit" data-testid="submit-register" [disabled]="isLoadingRegister"
          class="btn btn-primary w-full rounded-xl">
          <span *ngIf="isLoadingRegister" class="loading loading-spinner loading-sm"></span>
          {{ isLoadingRegister ? 'Cadastrando...' : 'Criar minha conta' }}
          <span *ngIf="!isLoadingRegister" class="material-icons text-base">arrow_forward</span>
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-5">
        Já tem uma conta?
        <button type="button" (click)="navigateRoute('/login')" class="text-primary font-semibold hover:underline">
          Entre
        </button>
      </p>
    </section>
  </main>
</div>
