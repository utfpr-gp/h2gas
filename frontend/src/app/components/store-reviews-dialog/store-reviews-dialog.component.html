<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-gray-900/40 sm:p-4" (click)="close()">
  <div role="dialog" aria-modal="true" aria-labelledby="reviews-title" @fadeIn (click)="$event.stopPropagation()"
    class="w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-xl shadow-xl flex flex-col max-h-[85vh]">
    <header class="flex items-start justify-between gap-3 p-4 md:p-5 border-b border-gray-200">
      <div class="min-w-0">
        <h2 id="reviews-title" class="text-lg font-bold text-gray-800">Avaliações</h2>
        <p *ngIf="storeName" class="text-sm text-gray-500 truncate">{{ storeName }}</p>
        <app-store-rating class="mt-1 block" size="sm" [average]="average" [count]="count"></app-store-rating>
      </div>
      <button #closeButton type="button" data-testid="close-reviews" class="btn btn-ghost btn-sm btn-circle min-h-11 min-w-11"
        aria-label="Fechar avaliações" (click)="close()">
        <span class="material-icons" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="overflow-y-auto p-4 md:p-5">
      <ul class="space-y-3" aria-label="Lista de avaliações">
        <li *ngFor="let review of reviews; trackBy: trackById" data-testid="review-item"
          class="rounded-lg border border-gray-200 p-3">
          <div class="flex items-center justify-between gap-2">
            <span data-testid="review-name" class="font-semibold text-gray-800">{{ review.customerFirstName }}</span>
            <span *ngIf="review.reviewedAt" class="text-xs text-gray-500">{{ review.reviewedAt | date:'dd/MM/yyyy' }}</span>
          </div>
          <div data-testid="review-stars" class="flex mt-0.5" role="img" [attr.aria-label]="'Nota ' + review.rating + ' de 5'">
            <span *ngFor="let star of stars" class="material-icons text-base!" aria-hidden="true"
              [ngClass]="star <= review.rating ? 'text-warning' : 'text-gray-300'">{{ star <= review.rating ? 'star' : 'star_border' }}</span>
          </div>
          <p *ngIf="review.comment" data-testid="review-comment" class="mt-1.5 text-sm text-gray-700 leading-relaxed">{{ review.comment }}</p>
        </li>
      </ul>

      <div *ngIf="loading" class="space-y-3" [class.mt-3]="reviews.length" aria-hidden="true">
        <div *ngFor="let s of [1, 2, 3]" class="rounded-lg border border-gray-200 p-3 space-y-2">
          <div class="skeleton h-4 w-24"></div>
          <div class="skeleton h-3 w-20"></div>
          <div class="skeleton h-3 w-full"></div>
        </div>
      </div>

      <div *ngIf="error" data-testid="reviews-error" class="mt-3 text-sm text-error" role="alert">
        {{ error }}
        <button type="button" data-testid="retry-reviews" class="btn btn-sm btn-outline btn-primary rounded-lg mt-2 block" (click)="retry()">
          Tentar de novo
        </button>
      </div>

      <p *ngIf="!loading && !error && !reviews.length" class="text-sm text-gray-500">Esta loja ainda não tem avaliações.</p>

      <button *ngIf="hasNext && !loading && !error" type="button" data-testid="load-more-reviews"
        class="btn btn-outline btn-primary btn-sm w-full rounded-lg mt-4 min-h-11 sm:min-h-8" (click)="loadMore()">
        Ver mais avaliações
      </button>
    </div>
  </div>
</div>
