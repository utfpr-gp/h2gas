<div class="bg-white rounded-xl shadow-md overflow-hidden p-4 border border-gray-200 flex items-center gap-4">
  <span class="material-icons text-primary text-3xl">storefront</span>

  <div class="flex-grow min-w-0">
    <h2 class="font-bold text-gray-800 truncate">{{ supplier.name }}</h2>

    <div class="flex items-center text-gray-400 text-xs gap-1">
      <span class="material-icons text-sm">star_border</span>
      <span>Sem avaliações ainda</span>
    </div>

    <div class="flex items-center text-gray-500 text-xs gap-1 mt-1" *ngIf="supplier.openingTime && supplier.closingTime">
      <span class="material-icons text-sm">schedule</span>
      <span>{{ supplier.openingTime }} - {{ supplier.closingTime }}</span>
      <span *ngIf="supplier.averageDeliveryTime"> · {{ supplier.averageDeliveryTime }} min</span>
    </div>
  </div>

  <button
    type="button"
    data-testid="view-products"
    (click)="onViewProducts()"
    class="bg-primary text-white text-sm font-semibold rounded-md px-4 py-2 shrink-0">
    Ver Produtos
  </button>
</div>
