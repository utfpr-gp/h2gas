<input type="checkbox" id="delete-modal" class="modal-toggle" />
<div class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Tem certeza que deseja excluir a cidade {{ itemName }}?</h3>
    <p class="py-4">Essa ação não poderá ser desfeita.</p>
    <div class="modal-action">
      <label for="delete-modal" class="btn btn-error" (click)="confirm.emit()">Confirmar</label>
      <label for="delete-modal" class="btn" (click)="cancel.emit()">Cancelar</label>
    </div>
  </div>
</div>
