<div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col">
  <div class="bg-gray-50 p-4 flex items-center justify-center h-32 overflow-hidden">
    <img
      *ngIf="product.imageUrl"
      [src]="product.imageUrl"
      [alt]="product.brand"
      class="object-contain h-full w-auto" />
    <span *ngIf="!product.imageUrl" class="material-icons text-gray-300 text-5xl">inventory_2</span>
  </div>

  <div class="p-3 flex flex-col flex-grow gap-1">
    <h3 class="font-semibold text-sm text-gray-800 truncate">{{ product.brand }} {{ product.category }}</h3>
    <span *ngIf="product.freeDelivery" data-testid="free-delivery"
      class="self-start inline-flex items-center gap-1 rounded-full bg-green-100 text-green-700 text-[11px] font-bold px-2 py-0.5">
      <span class="material-icons text-xs">local_shipping</span>Entrega Grátis
    </span>
    <div class="flex flex-col gap-0.5 text-sm">
      <div class="flex items-center justify-between gap-2" data-testid="price-delivery">
        <span class="flex items-center gap-1 text-gray-500">
          <span class="material-icons text-sm">local_shipping</span>Entrega
        </span>
        <span class="font-bold text-gray-900">{{ product.priceDelivery | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
      <div class="flex items-center justify-between gap-2" data-testid="price-pickup">
        <span class="flex items-center gap-1 text-gray-500">
          <span class="material-icons text-sm">storefront</span>Retirada
        </span>
        <span class="font-bold text-primary">{{ product.pricePickup | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
    </div>

    <button
      type="button"
      data-testid="add-to-cart"
      (click)="onAdd()"
      class="mt-auto btn btn-accent btn-sm w-full rounded-lg">
      <span class="material-icons text-base" aria-hidden="true">add_shopping_cart</span>
      Adicionar
    </button>
  </div>
</div>
