<form [formGroup]="form" class="space-y-4">
  <div class="form-control">
    <label class="label">
      <span class="label-text">Nome do endereço</span>
    </label>
    <input type="text" placeholder="Ex.: Casa, Trabalho" class="input input-bordered w-full rounded-xl"
      formControlName="addressName" />
    <div class="flex gap-2 mt-2">
      <button type="button" *ngFor="let rotulo of sugestoesRotulo" (click)="usarRotulo(rotulo)"
        class="px-3 py-1 rounded-full border text-xs"
        [class.bg-primary]="form.get('addressName')?.value === rotulo"
        [class.text-white]="form.get('addressName')?.value === rotulo"
        [class.border-primary]="form.get('addressName')?.value === rotulo"
        [class.border-gray-300]="form.get('addressName')?.value !== rotulo"
        [class.text-gray-600]="form.get('addressName')?.value !== rotulo">
        {{ rotulo }}
      </button>
    </div>
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text">CEP</span>
    </label>
    <div class="flex gap-2">
      <input type="text" mask="00000-000" placeholder="00000-000" class="input input-bordered w-full rounded-xl"
        formControlName="zipCode" (blur)="buscarCep()" />
      <button type="button" class="btn btn-outline btn-primary rounded-xl" (click)="buscarCep()" [disabled]="isLoadingCep">
        Buscar
      </button>
    </div>
  </div>

  <div class="form-control" *ngIf="cidadeEncontrada">
    <label class="label">
      <span class="label-text">Rua</span>
    </label>
    <input type="text" class="input input-bordered w-full rounded-xl" formControlName="streetName" readonly />
  </div>

  <div class="form-control" *ngIf="cidadeEncontrada">
    <label class="label">
      <span class="label-text">Bairro</span>
    </label>
    <input type="text" class="input input-bordered w-full rounded-xl" formControlName="neighborhood" readonly />
  </div>

  <div class="grid grid-cols-2 gap-3" *ngIf="cidadeEncontrada">
    <div class="form-control">
      <label class="label">
        <span class="label-text">Número</span>
      </label>
      <input type="text" class="input input-bordered w-full rounded-xl" formControlName="number" />
    </div>
    <div class="form-control">
      <label class="label">
        <span class="label-text">Complemento</span>
      </label>
      <input type="text" class="input input-bordered w-full rounded-xl" formControlName="complement" />
    </div>
  </div>

  <button type="button" (click)="salvar()" class="btn btn-primary w-full mt-2 rounded-xl"
    [disabled]="isSaving || !cidadeEncontrada">
    <ng-container *ngIf="!isSaving">Salvar endereço</ng-container>
    <ng-container *ngIf="isSaving">Salvando...</ng-container>
  </button>
</form>
