<div class="overflow-x-auto rounded-lg shadow-md">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th *ngFor="let column of columns" class="px-4 py-2 text-left font-medium text-gray-700 uppercase">
            {{ column.label }}
          </th>
          <th *ngIf="actions.length" class="px-4 py-2 text-center font-medium text-gray-700 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 bg-white">
        <tr *ngFor="let row of data" class="hover:bg-gray-50 transition">
          <td *ngFor="let column of columns" class="px-4 py-2 text-gray-900">
            <ng-container [ngSwitch]="column.type">
              <!-- Renderiza o switch se o tipo da coluna for 'switch' -->
              <ng-container *ngSwitchCase="'switch'">
                <label class="inline-flex items-center cursor-pointer">
                  <input type="checkbox"
                         class="toggle toggle-success"
                         [checked]="getNestedValue(row, column.key)"
                         (change)="onSwitchToggle(row, column.key, $event)">
                  <!-- <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-500 
                              rounded-full peer peer-checked:bg-blue-600 relative transition">
                    <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full 
                                transition-transform peer-checked:translate-x-5"></div>
                  </div> -->
                </label>
              </ng-container>
      
              <!-- Renderiza texto padrão caso não seja switch -->
              <ng-container *ngSwitchDefault>
                {{ getNestedValue(row, column.key) }}
              </ng-container>
            </ng-container>
          </td>
          
          <!-- Ações -->
          <td *ngIf="actions.length" class="px-4 py-2 text-center">
            <button
              *ngFor="let action of actions"
              class="btn btn-sm text-white p-2 mx-1 rounded transition-all duration-200"
              [ngClass]="action.class"
              (click)="action.onClick(row)"
              [title]="action.label"
            >
              <i *ngIf="action.icon" class="{{ action.icon }}"></i>
              <span *ngIf="!action.icon">{{ action.label }}</span>
            </button>
          </td>
        </tr>
      </tbody>

          <td *ngFor="let column of columns" class="px-4 py-2 text-gray-900">

          </td>
        </tr>
      </tbody> -->
    </table>
  </div>
