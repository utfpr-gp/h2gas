<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md text-center animate-fade-in-up">
        <div class="flex justify-center mb-4">
            <div class="bg-green-100 p-4 rounded-full animate-pop">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <h2 class="text-2xl font-semibold text-gray-800 mb-2">
            E-mail enviado!
        </h2>
        <p class="text-gray-600 mb-6">
            Se o endereço informado estiver correto, você receberá um link para redefinir sua senha em alguns instantes.
        </p>

        <button (click)="navigate('/')"
            class="inline-block cursor-pointer bg-blue-600 text-white font-medium px-6 py-2 rounded-lg hover:bg-blue-700 transition">
            Voltar para o login
        </button>
    </div>
</div>
