<section class="bg-[#0E2068] bg-gradient-to-r from-[#0E2068] to-[#3B82F6] min-h-screen flex flex-col items-center justify-center px-4 py-16">
    <div class="flex items-center justify-center min-h-screen">
        <div class="mr-9">
            <img src="../assets/logo-h2.png" alt="logo">
        </div>
  
      <!-- CARD -->
      <div class="card w-[420px] bg-white shadow-xl p-8 rounded-2xl">
        <h2 class="text-2xl font-semibold text-center mb-2">Redefinir senha</h2>
        <p class="text-gray-500 text-center mb-6 text-sm">
          Escolha uma nova senha para sua conta.
        </p>
  
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
          <div class="form-control">
            <label class="label">
              <span class="label-text">Nova senha</span>
            </label>
            <input
              type="password"
              placeholder="Digite a nova senha"
              class="input input-bordered w-full"
              formControlName="password"
            />
          </div>
  
          <div class="form-control">
            <label class="label">
              <span class="label-text">Confirmar senha</span>
            </label>
            <input
              type="password"
              placeholder="Repita a nova senha"
              class="input input-bordered w-full"
              formControlName="confirmPassword"
            />
          </div>
  
          <button
            type="submit"
            class="btn btn-primary w-full mt-2 rounded-lg"
            [disabled]="loading"
          >
            <span *ngIf="!loading">Redefinir senha</span>
            <span *ngIf="loading">Processando...</span>
          </button>
        </form>
  
        <p *ngIf="errorMessage" class="text-red-600 mt-4 text-center text-sm">
          {{ errorMessage }}
        </p>
        <p *ngIf="successMessage" class="text-green-600 mt-4 text-center text-sm">
          {{ successMessage }}
        </p>
  
        <div class="text-center mt-6 text-sm text-gray-500">
          <button routerLink="/login" class="hover:underline">Voltar ao login</button>
        </div>
      </div>
    </div>
  </section>
