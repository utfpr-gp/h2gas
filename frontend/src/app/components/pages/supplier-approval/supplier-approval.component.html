<div class="flex-1 bg-base-200">
  <div class="container mx-auto px-4 py-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Ativar Fornecedores</h1>
    </div>
    <div class="w-full space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="relative w-full sm:w-64">
          <i class="fas fa-search absolute left-2.5 top-2.5 h-4 w-4 text-gray-500"></i>
          <input
            type="search"
            placeholder="Buscar fornecedores..."
            class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-transparent"
          />
        </div>
      </div>

      <div class="overflow-x-auto rounded-lg shadow-md">
        <app-dynamic-table 
        [data]="suppliers!!"
        [columns]="columns!!"
        (switchChanged)="handleSwitchChange($event)"
        >

        </app-dynamic-table>
      </div>
    </div>
  </div>
</div>
