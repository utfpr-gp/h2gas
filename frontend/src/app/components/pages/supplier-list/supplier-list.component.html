<!DOCTYPE html>
<html lang="pt-br">

<body class="p-4 pb-20 md:p-8 md:pb-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-8 text-center" *ngIf="viewMode === 'suppliers'">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Fornecedores de Água e Gás</h1>
        </div>
        <div class="mb-8 text-center" *ngIf="viewMode !== 'suppliers'">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Produtos</h1>
            <p class="text-lg text-gray-600">
                Encontre os melhores produtos.
            </p>
        </div>

        <!-- Barra de pesquisa e filtros -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <!-- Pesquisa -->
            <div class="relative flex-grow">
                <form [formGroup]="formSearch">
                    <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                    <input formControlName="name"
                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-full bg-white focus:ring-primary focus:border-primary"
                        placeholder="Buscar botijão, água, loja..." type="text" />
                </form>
            </div>

            <!-- Botão filtrar -->
            <button (click)="buscar()"
                class="bg-primary cursor-pointer text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center hover:opacity-90">
                <i class="fa-solid fa-filter mr-2"></i>
                Filtrar
            </button>

            <!-- Botão de alternância -->
            <div class="relative">
                <button (click)="toggleView()"
                    class="w-full md:w-auto bg-primary cursor-pointer text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center hover:opacity-90">
                    <i class="fa-solid fa-box mr-2"></i>
                    {{ viewMode === 'suppliers' ? 'Ver Produtos' : 'Ver Fornecedores' }}
                </button>
            </div>
        </div>

        <!-- ================== LISTA DE FORNECEDORES ================== -->
        <div *ngIf="viewMode === 'suppliers'">

            <!-- Banners promocionais -->
            <div class="flex flex-col gap-3 mb-6">
                <div *ngFor="let banner of promoBanners"
                    class="bg-gradient-to-r from-primary to-blue-600 text-white rounded-xl p-4">
                    <p class="font-bold">{{ banner.title }}</p>
                    <p class="text-sm opacity-90">{{ banner.subtitle }}</p>
                </div>
            </div>

            <span *ngIf="searchDone"
                class="inline-block bg-gray-200 text-gray-700 text-sm font-semibold px-4 py-2 rounded-full mb-6">
                {{suppliers?.length}} fornecedores encontrados
            </span>
            <div *ngIf="suppliers?.length == 0" class="p-4 text-center text-gray-600 italic">
                Nenhum fornecedor encontrado.
            </div>

            <h3 class="text-lg font-bold text-gray-800 mb-3">Lojas Próximas</h3>
            <div class="flex flex-col gap-4">
                <app-supplier-card
                    *ngFor="let supplier of suppliers"
                    [supplier]="supplier"
                    (viewProducts)="navigate($event)">
                </app-supplier-card>
            </div>
        </div>

        <!-- ================== LISTA DE PRODUTOS ================== -->
        <div *ngIf="viewMode === 'products'">
            <!-- Chips de categoria -->
            <app-category-chip-bar
                [categories]="categories"
                [selected]="selectedCategory"
                (categorySelected)="selectCategory($event)">
            </app-category-chip-bar>

            <!-- Ordenar por menor preço -->
            <div class="my-4">
                <button type="button" (click)="toggleSortByPrice()"
                    class="btn btn-sm" [class.btn-primary]="sortByPrice" [class.btn-outline]="!sortByPrice">
                    <span class="material-icons text-sm align-middle">sort</span>
                    Menor preço
                </button>
            </div>

            <span class="inline-block bg-gray-200 text-gray-700 text-sm font-semibold px-4 py-2 rounded-full mb-6">
                {{products.length}} produtos encontrados
            </span>

            <div *ngIf="products?.length == 0" class="p-4 text-center text-gray-600 italic">
                Nenhum produto encontrado.
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <app-product-card
                    *ngFor="let product of products"
                    [product]="product"
                    (addToCart)="addToCart($event)">
                </app-product-card>
            </div>
        </div>

        <!-- Paginação -->
        <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="getSuppliers($event)">
        </app-pagination>
    </div>
</body>

</html>
