<div class="max-w-4xl mx-auto p-4 mb-6">
  <div class="bg-white rounded-xl border border-blue-300 shadow-2xl">
    <div class="bg-blue-700 text-white rounded-t-xl p-4 shadow-md">
      <h2 class="text-xl font-semibold">Editar </h2>
      <p class="text-sm text-blue-100">Preencha as informações basicas da sua fornecedora</p>
    </div>

    <div class="p-6">
      <form [formGroup]="registerFormUser" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nome Usuário</label>
            <input formControlName="name" type="text"
              class="mt-1 block w-full rounded-lg border-2 border-blue-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Nome Usuário" />
          </div>

          <div class="form-control">
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" placeholder="email@exemplo.com" formControlName="email"
              class="mt-1 block w-full rounded-lg border-2 border-blue-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Telefone de contato</label>
            <input formControlName="phoneNumber" type="text" mask="(00) 00000-0000"
              class="mt-1 block w-full rounded-lg border-2 border-blue-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="(00) 00000-0000" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Endereços</label>
            <button type="button" data-testid="atalho-meus-enderecos" (click)="goToAddresses()"
              class="mt-1 flex items-center gap-1 px-3 py-1.5 text-blue-600 border border-blue-500 rounded-lg hover:bg-blue-50">
              Meus endereços
            </button>
          </div>
        </div>

        <div class="mt-6">
          <button type="submit" (click)="update()"
            class="w-full cursor-pointer bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg shadow-md">
            Editar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
