<div class="max-w-2xl mx-auto p-4 pb-24 md:p-8">
  <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Meus dados</h1>
  <p class="text-gray-500 text-sm mb-6">Mantenha suas informações de contato atualizadas.</p>

  <div class="bg-white rounded-xl shadow-md border border-gray-200 p-4 md:p-6 mb-4">
    <form [formGroup]="registerFormUser" class="space-y-4">
      <div class="form-control">
        <label class="label"><span class="label-text">Nome</span></label>
        <input formControlName="name" type="text" placeholder="Seu nome"
          class="input input-bordered w-full rounded-xl" />
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Email</span></label>
        <input formControlName="email" type="email" placeholder="email@exemplo.com"
          class="input input-bordered w-full rounded-xl" />
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Telefone de contato</span></label>
        <input formControlName="phoneNumber" type="text" mask="(00) 00000-0000" placeholder="(00) 00000-0000"
          class="input input-bordered w-full rounded-xl" />
      </div>

      <button type="submit" (click)="update()" class="btn btn-primary w-full rounded-xl">
        Salvar alterações
      </button>
    </form>
  </div>

  <button type="button" data-testid="atalho-meus-enderecos" (click)="goToAddresses()"
    class="w-full bg-white rounded-xl shadow-md border border-gray-200 p-4 flex items-center gap-3 text-left hover:border-primary transition">
    <span class="material-icons text-primary">location_on</span>
    <div class="flex-grow">
      <p class="font-semibold text-gray-800">Meus endereços</p>
      <p class="text-sm text-gray-500">Veja, adicione e escolha onde receber</p>
    </div>
    <span class="material-icons text-gray-400">chevron_right</span>
  </button>
</div>
