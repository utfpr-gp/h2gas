<div class="min-h-screen bg-gray-50">
  <header class="bg-primary text-white px-4 pt-10 pb-24 text-center">
    <img src="../assets/logo-h2.png" alt="H2Gás" class="w-28 mx-auto drop-shadow-lg" />
    <p class="text-sm text-white/90 max-w-xs mx-auto mt-3">
      A energia e a hidratação que movem o seu dia, a um clique de distância.
    </p>
  </header>

  <main class="px-4 -mt-16 pb-12">
    <section class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-md mx-auto p-6">
      <h1 class="text-xl font-bold text-gray-800">Bem-vindo de volta</h1>
      <p *ngIf="checkoutLogin" data-testid="checkout-login-hint" role="status"
        class="mt-2 inline-flex items-center gap-1.5 rounded-lg bg-accent/10 text-accent text-sm font-semibold px-3 py-1.5">
        <span class="material-icons text-base!" aria-hidden="true">shopping_cart</span>
        Entre para finalizar sua compra
      </p>
      <p class="text-sm text-gray-500">Insira seus dados para acessar o sistema</p>

      <form [formGroup]="loginform" (ngSubmit)="login()" class="mt-5 space-y-4">
        <label class="block">
          <span class="text-sm font-medium text-gray-700">E-mail</span>
          <span class="relative mt-1 block">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 z-10 pointer-events-none text-gray-400 text-base">mail</span>
            <input type="email" placeholder="seu@email.com" formControlName="email" autocomplete="email"
              class="input w-full rounded-xl border border-gray-300 bg-white pl-10" />
          </span>
        </label>

        <label class="block">
          <span class="flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700">Senha</span>
            <button type="button" (click)="navigate('/recuperar-senha')" class="text-sm font-semibold text-primary hover:underline">
              Esqueceu a senha?
            </button>
          </span>
          <span class="relative mt-1 block">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 z-10 pointer-events-none text-gray-400 text-base">lock</span>
            <input type="password" placeholder="Digite sua senha" formControlName="password" autocomplete="current-password"
              class="input w-full rounded-xl border border-gray-300 bg-white pl-10" />
          </span>
        </label>

        <button type="submit" data-testid="submit-login" [disabled]="loading" class="btn btn-primary w-full rounded-xl">
          <span *ngIf="loading" class="loading loading-spinner loading-sm"></span>
          {{ loading ? 'Entrando...' : 'Entrar' }}
          <span *ngIf="!loading" class="material-icons text-base">arrow_forward</span>
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-5">
        Não tem uma conta?
        <button type="button" (click)="navigate('/cadastro')" class="text-primary font-semibold hover:underline">
          Cadastre-se
        </button>
      </p>

      <div class="flex items-center gap-3 my-4">
        <span class="h-px flex-1 bg-gray-200"></span>
        <span class="text-xs text-gray-400">OU</span>
        <span class="h-px flex-1 bg-gray-200"></span>
      </div>

      <button type="button" data-testid="code-login" (click)="navigate('/login/token')"
        class="w-full flex items-center justify-center gap-2 text-sm font-semibold text-gray-700 hover:underline">
        <span class="material-icons text-base">mail</span> Entrar com código por e-mail
      </button>
    </section>
  </main>
</div>
