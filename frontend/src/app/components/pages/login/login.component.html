<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <section class="bg-[#0E2068] bg-gradient-to-r from-[#0E2068] to-[#3B82F6] min-h-screen flex flex-col items-center justify-center px-4 py-16">
        <div class="flex items-center justify-center min-h-screen">
            <div class="mr-9">
                <img src="../assets/logo-h2.png" alt="logo">
            </div>
            
            <div class="card w-96 bg-white shadow-xl p-8">
                <h2 class="text-2xl font-semibold text-center mb-4">Faça seu login aqui!</h2>
                
                <form [formGroup]="loginform">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Email</span>
                        </label>
                        <input type="email" placeholder="email@exemplo.com" class="input input-bordered w-full" 
                        formControlName="email"
                        >
                    </div>
            
                    <div class="form-control mt-4">
                        <label class="label">
                            <span class="label-text">Senha</span>
                        </label>
                        <input type="password" placeholder="Digite sua senha" class="input input-bordered w-full"
                        formControlName="password"
                        >
                    </div>
            
                    <div class="form-control mt-4">
                        <label class="cursor-pointer flex items-center">
                            <input type="checkbox" class="checkbox checkbox-primary mr-2">
                            <span class="label-text">Lembre-se de mim</span>
                        </label>
                    </div>
                </form>
        
                <button class="btn btn-primary w-full mt-6 rounded-lg">Login</button>
        
                <div class="text-center mt-4 text-sm text-gray-500">
                    <button class="hover:underline">Recuperar senha</button> | 
                    <button (click)="navigate('/register')" class="hover:underline">Criar conta</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
