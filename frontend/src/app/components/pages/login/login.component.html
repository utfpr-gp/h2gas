<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>

  <body class="bg-gradient-to-r from-[#0E2068] to-[#3B82F6] min-h-screen flex items-center justify-center px-4 py-10">
    <section
      class="flex flex-col md:flex-row items-center justify-center w-full max-w-6xl bg-transparent space-y-8 md:space-y-0 md:space-x-12"
    >
      <!-- LOGO -->
      <div class="flex justify-center">
        <img
          src="../assets/logo-h2.png"
          alt="logo"
          class="w-40 sm:w-52 md:w-64 lg:w-72 max-w-full drop-shadow-lg"
        />
      </div>

      <!-- CARD DE LOGIN -->
      <div class="bg-white shadow-2xl rounded-2xl w-full max-w-sm sm:max-w-md p-8">
        <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
          Faça seu login aqui!
        </h2>

        <form [formGroup]="loginform" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              type="email"
              placeholder="email@exemplo.com"
              formControlName="email"
              class="input input-bordered w-full rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input
              type="password"
              placeholder="Digite sua senha"
              formControlName="password"
              class="input input-bordered w-full rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </form>

        <button
          class="btn btn-primary w-full mt-6 rounded-lg text-white font-medium tracking-wide transition-all duration-200 hover:bg-blue-600"
          (click)="login()"
        >
          Login
        </button>

        <div class="text-center mt-6 text-sm text-gray-600 space-x-2">
          <button (click)="navigate('/recuperar-senha')" class="hover:underline">
            Recuperar senha
          </button>
          <span>|</span>
          <button (click)="navigate('/register')" class="hover:underline">
            Criar conta
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
