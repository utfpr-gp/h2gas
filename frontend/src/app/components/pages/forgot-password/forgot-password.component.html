<div class="bg-primary bg-gradient-to-r from-primary to-secondary min-h-screen flex items-center justify-center px-4 py-12">

  <div class="flex flex-col md:flex-row items-center justify-center w-full max-w-5xl bg-transparent">

    <!-- LOGO -->
    <div class="mb-10 md:mb-0 md:mr-10 flex justify-center">
      <img src="../assets/logo-h2.png" alt="logo" class="w-40 md:w-56 lg:w-64">
    </div>

    <!-- CARD -->
    <div class="w-full max-w-sm bg-white shadow-xl p-8 rounded-2xl">
      <h2 class="text-2xl font-semibold text-center mb-2">Recuperar senha</h2>
      <p class="text-gray-500 text-center mb-6 text-sm">
        Informe seu email para receber o link de redefinição.
      </p>

      <form [formGroup]="form" class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Email</span>
          </label>
          <input
            type="email"
            placeholder="email@exemplo.com"
            class="input input-bordered w-full"
            formControlName="email" />
        </div>

        <button
          (click)="submit()"
          class="btn btn-primary w-full mt-2 rounded-lg flex items-center justify-center"
          [disabled]="loading">
          <ng-container *ngIf="!loading">
            <span>Enviar link</span>
          </ng-container>

          <ng-container *ngIf="loading">
            <svg class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span>Enviando...</span>
          </ng-container>
        </button>
      </form>

      <p *ngIf="errorMessage" class="text-red-600 mt-4 text-center text-sm">
        {{ errorMessage }}
      </p>

      <div class="text-center mt-6 text-sm text-gray-500">
        <button (click)="navigate('/login')" class="hover:underline">
          Voltar ao login
        </button>
      </div>
    </div>
  </div>
</div>
