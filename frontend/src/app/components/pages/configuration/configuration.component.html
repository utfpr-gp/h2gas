<div class="p-10 space-y-10 bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
  <h1 class="text-4xl font-extrabold text-blue-700 mb-8 tracking-tight flex items-center gap-3">
    <i class="fa-solid fa-gear text-blue-600"></i>
    Configurações
  </h1>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
    <!-- Gestão de Estoque -->
    <div
      class="bg-white p-8 rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 border border-gray-100"
    >
      <div class="flex items-center gap-3 mb-4">
        <div class="p-3 rounded-full bg-blue-100 text-blue-600">
          <i class="fa-solid fa-boxes-stacked text-xl"></i>
        </div>
        <h2 class="text-2xl font-semibold text-gray-800">Gestão de Estoque</h2>
      </div>

      <p class="text-gray-500 mb-6 text-sm leading-relaxed">
        Configure os níveis mínimos de estoque e a reposição automática para acompanhar melhor o desempenho do seu
        negócio.
      </p>

      <div class="space-y-5">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Estoque Mínimo - Água (galões)</label>
          <input
            type="number"
            placeholder="Ex: 10"
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition-all"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Estoque Mínimo - Gás (botijões)</label>
          <input
            type="number"
            placeholder="Ex: 5"
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition-all"
          />
        </div>

        <div class="flex items-center justify-between mt-5 border-t pt-4">
          <span class="text-gray-700 font-medium">Reposição Automática</span>
          <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" />
            <div
              class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-blue-500 transition-colors duration-300 relative"
            >
              <div
                class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 peer-checked:translate-x-5"
              ></div>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Horário de Funcionamento -->
    <div
      class="bg-white p-8 rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 border border-gray-100"
    >
      <div class="flex items-center gap-3 mb-4">
        <div class="p-3 rounded-full bg-blue-100 text-blue-600">
          <i class="fa-solid fa-clock text-xl"></i>
        </div>
        <h2 class="text-2xl font-semibold text-gray-800">Horário de Funcionamento</h2>
      </div>

      <p class="text-gray-500 mb-6 text-sm leading-relaxed">
        Defina os horários de abertura e fechamento do seu estabelecimento.
      </p>

      <div class="grid grid-cols-2 gap-6">
        <div>
          <label class="block text-gray-700 font-medium mb-1 flex items-center gap-2">
            <i class="fa-solid fa-door-open text-blue-500"></i>
            Abertura
          </label>
          <input
            type="time"
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition-all"
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1 flex items-center gap-2">
            <i class="fa-solid fa-door-closed text-blue-500"></i>
            Fechamento
          </label>
          <input
            type="time"
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition-all"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Botão de ação -->
  <div class="flex justify-end mt-10">
    <button
      class="bg-blue-600 text-white px-8 py-3 rounded-xl font-medium shadow-md hover:bg-blue-700 hover:shadow-lg transition-all duration-300 flex items-center gap-2"
    >
      <i class="fa-solid fa-floppy-disk"></i>
      Salvar Configurações
    </button>
  </div>
</div>
