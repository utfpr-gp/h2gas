<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 px-4">
    <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md w-full text-center">
        <!-- Ícone -->
        <div class="flex justify-center mb-6">
            <svg class="w-20 h-20 text-blue-500 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M12 12h.01M12 12v.01M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z">
                </path>
            </svg>
        </div>

        <!-- Título -->
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Aguardando Aprovação</h1>

        <!-- Descrição -->
        <p class="text-gray-600 mb-6">
            Sua conta de fornecedor foi criada com sucesso e está aguardando aprovação de um administrador.
            Assim que for aprovada, você poderá acessar todas as funcionalidades.
        </p>

        <!-- Sugestão de botão -->
        <button (click)="goHome()"
            class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-300 shadow-md">
            Voltar para Home
        </button>
    </div>
</div>
