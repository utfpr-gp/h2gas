<div class="min-h-screen bg-linear-to-br from-primary to-secondary flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white shadow-xl p-6 md:p-8 rounded-2xl">
    <div class="flex justify-center mb-4">
      <span class="w-14 h-14 rounded-full bg-accent/10 text-accent flex items-center justify-center">
        <span class="material-icons text-3xl!" aria-hidden="true">location_on</span>
      </span>
    </div>
    <h1 class="text-2xl font-bold text-center text-gray-800">Onde você está?</h1>
    <p class="text-gray-600 text-center mt-1 mb-6 text-sm">
      Informe seu CEP para ver as lojas de gás e água que entregam na sua cidade. Não precisa criar conta.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-3">
      <label for="visitor-cep" class="block text-sm font-medium text-gray-700">CEP</label>
      <input id="visitor-cep" data-testid="visitor-cep" type="text" inputmode="numeric" autocomplete="postal-code"
        mask="00000-000" placeholder="00000-000" formControlName="cep"
        [attr.aria-invalid]="message ? 'true' : null" aria-describedby="cep-message"
        class="input input-bordered w-full rounded-xl text-lg tracking-wide" />
      <p id="cep-message" data-testid="cep-message" class="text-sm min-h-5" [class.text-error]="message" role="status">{{ message }}</p>
      <button type="submit" data-testid="submit-cep" class="btn btn-accent w-full rounded-xl min-h-11" [disabled]="loading">
        <span *ngIf="loading" class="loading loading-spinner loading-sm"></span>
        Ver lojas da minha cidade
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Já tem conta?
      <a routerLink="/login" class="text-primary font-semibold hover:underline">Entrar</a>
    </p>
  </div>
</div>
