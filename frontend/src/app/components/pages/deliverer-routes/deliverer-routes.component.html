<div class="max-w-md mx-auto px-4 pt-5 pb-10">
    <div class="flex items-end justify-between mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Minhas Entregas</h1>
        <span data-testid="pending-count" class="text-sm font-semibold text-primary">
            {{ routes.length }} {{ routes.length === 1 ? 'pendente' : 'pendentes' }}
        </span>
    </div>

    <div *ngIf="loading" class="space-y-3">
        <div class="skeleton h-40 w-full rounded-xl"></div>
        <div class="skeleton h-40 w-full rounded-xl"></div>
    </div>

    <div *ngIf="!loading && !routes.length" class="text-center bg-white rounded-xl border border-gray-200 py-12 px-4">
        <span class="material-icons text-gray-300" style="font-size: 56px">two_wheeler</span>
        <p class="text-gray-700 font-semibold mt-2">Nenhuma entrega no momento</p>
        <p class="text-sm text-gray-500">Quando a loja despachar um pedido para você, ele aparece aqui.</p>
    </div>

    <ul class="space-y-3">
        <li *ngFor="let order of routes; trackBy: trackById" data-testid="route-card" @listItem
            class="bg-white rounded-xl shadow-md border border-gray-200 p-4">
            <button type="button" (click)="open(order)" class="w-full text-left" [attr.aria-label]="'Abrir entrega de ' + order.customerName">
                <span class="flex items-start justify-between gap-2">
                    <span class="flex items-start gap-2 min-w-0">
                        <span class="material-icons text-primary mt-0.5">location_on</span>
                        <span class="min-w-0">
                            <span class="block font-bold text-gray-800 truncate">{{ order.neighborhood }}</span>
                            <span class="block text-xs text-gray-500 truncate">
                                {{ order.streetName }}, {{ order.number }}<ng-container *ngIf="order.complement"> - {{ order.complement }}</ng-container>
                            </span>
                        </span>
                    </span>
                    <span *ngIf="isInRoute(order)" data-testid="badge-route" class="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary/10 text-primary">EM ROTA</span>
                    <span *ngIf="!isInRoute(order)" data-testid="badge-pending" class="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700">PENDENTE</span>
                </span>

                <span class="block mt-3 space-y-1 text-sm text-gray-800">
                    <span *ngFor="let item of order.orderItems" class="flex items-center gap-2">
                        <span class="material-icons text-base text-gray-400">inventory_2</span>
                        {{ item.quantity }}x {{ item.productBrand }} {{ item.productNameCategory }}
                    </span>
                    <span class="flex items-center gap-2 text-gray-600">
                        <span class="material-icons text-base text-gray-400">payments</span>
                        {{ paymentLabel(order.paymentMethod) }} · {{ order.totalPrice | currency:'BRL':'symbol':'1.2-2' }}
                    </span>
                </span>
            </button>

            <button *ngIf="!isInRoute(order)" type="button" data-testid="start-delivery" (click)="start(order)" [disabled]="startingId === order.id"
                class="btn btn-primary w-full rounded-xl mt-4">
                <span *ngIf="startingId === order.id" class="loading loading-spinner loading-sm"></span>
                Iniciar Entrega
                <span *ngIf="startingId !== order.id" class="material-icons text-base">arrow_forward</span>
            </button>

            <button *ngIf="isInRoute(order)" type="button" data-testid="confirm-delivery" (click)="confirm(order)" [disabled]="confirmingId === order.id"
                class="btn btn-primary w-full rounded-xl mt-4">
                <span *ngIf="confirmingId === order.id" class="loading loading-spinner loading-sm"></span>
                <span *ngIf="confirmingId !== order.id" class="material-icons text-base">task_alt</span>
                Confirmar entrega
            </button>
        </li>
    </ul>
</div>
