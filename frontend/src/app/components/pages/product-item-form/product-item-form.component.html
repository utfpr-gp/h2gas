<div class="p-6 max-w-3xl mx-auto">
    <div class="bg-blue-700 text-white px-6 py-4 rounded-t-xl shadow-md">
      <div class="flex items-center gap-2">
        <span class="text-xl font-semibold">Adicionar Novo Produto</span>
      </div>
      <p class="text-sm mt-1">Preencha os dados para adicionar um novo produto</p>
    </div>
  
    <form class="bg-white p-6 rounded-b-xl shadow-md space-y-4" [formGroup]="formProductItem">
      <h2 class="text-lg font-bold text-blue-700">Informações do Produto</h2>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Marca</label>
          <input type="text" formControlName="brand" placeholder="Ex: Botijão Ultragaz"
                 class="w-full border bg-blue-100 rounded-md px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
  
        <div>
          <label class="text-sm font-medium text-gray-700">Categoria</label>
          <select 
            formControlName="categoryProductId"
            class="mt-1 block w-full rounded-lg border-2 borPder-blue-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
            <option *ngFor="let category of categoryProduct" 
                [ngValue]="category.id">
                {{ category.name }} - {{category.type}}
            </option>
        </select>
        </div>
  
        <div>
          <label class="text-sm font-medium text-gray-700">Preço (R$)</label>
          <input type="number" formControlName="price" step="0.01" value="0.00"
                 class="w-full border rounded-md px-3 bg-blue-100 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
  
        <div>
          <label class="text-sm font-medium text-gray-700">Estoque</label>
          <input type="number" value="0"  formControlName="stockQuantity"
                 class="w-full border rounded-md px-3 bg-blue-100 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="w-full max-w-md mx-auto">
          <label class="block text-gray-700 font-medium mb-2" for="description">
            Descrição do Produto
          </label>
          <textarea
            id="description"
            name="description"
            formControlName="description"
            rows="4"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 resize-none"
            placeholder="Escreva uma descrição detalhada para o produto"
          ></textarea>
        </div>

        <div class="w-full max-w-sm mx-auto mt-5">
          <label
            class="block w-full cursor-pointer border border-dashed border-gray-300 rounded-md px-4 py-10 text-center hover:bg-gray-50 transition relative"
          >
            <input type="file" (change)="onFileSelected($event)" hidden />
        
            <ng-container *ngIf="!selectedImage">
              <span class="text-gray-600">Clique ou arraste para selecionar uma imagem para seu produto</span>
            </ng-container>
        
            <ng-container *ngIf="selectedImage">
              <img [src]="selectedImage" alt="Pré-visualização" class="mx-auto max-h-48 object-contain rounded-md" />
              <button type="button" (click)="removeImage()" class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 rounded">X</button>
            </ng-container>
          </label>
        </div>
      </div>
  
      <div class="flex justify-between mt-6">
        <button type="button" class="bg-gray-400 text-white font-semibold px-6 py-2 cursor-pointer rounded-md hover:bg-blue-500">
          Cancelar
        </button> 
        <button type="button" (click)="isEdit ? updateProduct() : saveItemProduct()" class="bg-blue-700 text-white font-semibold px-6 py-2 cursor-pointer rounded-md hover:bg-blue-800">
          Adicionar Produto
        </button>
      </div>
    </form>
</div>
