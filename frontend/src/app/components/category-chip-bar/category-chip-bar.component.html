<div class="flex gap-3 overflow-x-auto pb-2" role="group" aria-label="Filtrar por tipo">
  <button
    type="button"
    data-testid="chip-all"
    class="flex flex-col items-center gap-1 shrink-0"
    [attr.aria-pressed]="selected === null"
    (click)="select(null)">
    <span
      class="w-14 h-14 rounded-full flex items-center justify-center border-2 transition-all duration-200 active:scale-95"
      [ngClass]="selected === null ? 'border-accent bg-accent text-white scale-105 shadow-md' : 'border-gray-200 text-gray-500 hover:border-accent/50'">
      <span class="material-icons">apps</span>
    </span>
    <span class="text-xs transition-colors duration-200" [ngClass]="selected === null ? 'text-accent font-semibold' : 'text-gray-700'">Todas</span>
  </button>

  <button
    type="button"
    class="flex flex-col items-center gap-1 shrink-0"
    *ngFor="let categoria of categories"
    [attr.data-testid]="'chip-' + categoria.name"
    [attr.aria-pressed]="selected === categoria.name"
    (click)="select(categoria)">
    <span
      class="w-14 h-14 rounded-full flex items-center justify-center border-2 transition-all duration-200 active:scale-95"
      [ngClass]="selected === categoria.name ? 'border-accent bg-accent text-white scale-105 shadow-md' : 'border-gray-200 text-gray-500 hover:border-accent/50'">
      <span class="material-icons">{{ iconFor(categoria) }}</span>
    </span>
    <span class="text-xs transition-colors duration-200" [ngClass]="selected === categoria.name ? 'text-accent font-semibold' : 'text-gray-700'">{{ categoria.name }}</span>
  </button>
</div>
