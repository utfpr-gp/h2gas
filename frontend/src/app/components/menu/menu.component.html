<div class="bg-[#0017bf]">
    <div class="container mx-auto flex h-16 items-center justify-between px-4">
        <!-- Logo & Mobile menu -->
        <div class="flex items-center gap-2">
        <button class="lg:hidden text-white hover:bg-[#0017bf]/80 p-2 rounded-md">
            <i class="fas fa-bars h-6 w-6"></i>
        </button>
        <div class="flex items-center">
            <div class="h-9 w-9 rounded-full flex items-center justify-center mr-2">
            <img src="../assets/logo-sem-titulo.png" alt="">
            </div>
            <span class="text-white text-xl font-bold tracking-tight hidden sm:inline-block">
            H2Gás
            </span>
        </div>
        </div>

        <!-- Desktop Navigation -->
        <div class="flex items-center gap-3">
        <nav class="hidden lg:flex items-center">
            <a routerLink="/" class="flex items-center cursor-pointer px-3 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
            <i class="fas fa-home h-5 w-5"></i>
            <span class="ml-2">Início</span>
            </a>
            <button style="anchor-name:--anchor-1" popovertarget="popover-1" class="flex items-center px-3 py-2 cursor-pointer text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
                <i class="fa-solid fa-fire-flame-simple"></i>
                <span class="ml-2">Produtos</span>
            </button>
            
            <ul *ngIf="user?.userType === 'ADMIN' && user?.userType === 'SUPPLIER'" class="dropdown menu w-52 rounded-box bg-base-100 shadow-sm"
                popover id="popover-1" style="position-anchor:--anchor-1">
                <li>
                    <a href="/product-items">Item produtos</a>
                </li>
                <li>
                    <a href="/category-products">Categoria de produtos</a>
                </li>
            </ul>
            <a routerLink="/pedidos" class="flex items-center cursor-pointer px-3 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
                <i class="fas fa-clipboard-list h-5 w-5"></i>
                <span class="ml-2">Pedidos</span>
            </a>
            <a *ngIf="user?.userType === 'ADMIN'" href="/register-city" class="flex items-center cursor-pointer px-3 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
                <i class="fas fa-map-marked-alt h-5 w-5"></i>
            <span class="ml-2">Cidades</span>
            </a>
            <a *ngIf="user?.userType === 'ADMIN'" href="/supplier-approval" class="flex cursor-pointer items-center px-3 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
                <i class="fas fa-store h-5 w-5"></i>
            <span class="ml-2">Distribuidores</span>
            </a>
            <!-- <a routerLink="/configuracoes" class="flex items-center px-3 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-md mx-1 transition-colors">
                <i class="fas fa-cog h-5 w-5"></i>
            <span class="ml-2">Configurações</span>
            </a> -->
        </nav>

        <!-- Notifications -->
        <button class="text-white hover:bg-white/10 relative p-2 rounded-md">
            <i class="fas fa-bell h-5 w-5"></i>
            <span class="absolute top-1 right-1 flex h-2 w-2 rounded-full bg-red-500"></span>
        </button>

        <!-- User Dropdown -->
        <div class="relative" (clickOutside)="closeUserMenu()">
            <button (click)="toggleUserMenu()" 
            class="text-white hover:bg-white/10 p-2 cursor-pointer 
                    rounded-md flex items-center focus:outline-none">
            <i class="fas fa-user h-5 w-5"></i>
            </button>
            <div *ngIf="userMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-2 z-50">
                <button *ngIf="user?.userType === 'ADMIN' && user?.userType === 'SUPPLIER'"  (click)="navigate('/management-distributor')" class="block px-4 cursor-pointer py-2 min-w-full text-sm text-gray-700 hover:bg-gray-100">
                    Minha Distribuidora
                </button>
                <button (click)="navigate('/management-distributor')" class="block cursor-pointer px-4 py-2 min-w-full text-sm text-gray-700 hover:bg-gray-100">
                    Meus Dados
                </button>
                <div class="border-t my-1"></div>
                <button (click)="logout()" class="block px-4 py-2 cursor-pointer text-sm text-gray-700 min-w-full hover:bg-gray-100">
                    Sair
                </button>
            </div>
        </div>
        </div>
    </div>
</div>
