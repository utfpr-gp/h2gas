# nginx do frontend para o deploy no Coolify.
# O Coolify (Traefik) cuida do domínio e do HTTPS e entrega o tráfego aqui na porta 80,
# então este arquivo não tem SSL nem redirecionamento para https.
# O workflow .github/workflows/coolify.yml copia este arquivo por cima de nginx.conf
# só durante o build da imagem; o nginx.conf da AWS continua igual no repositório.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # o backend aceita até 3 MB por requisição (banner da loja)
    client_max_body_size 3m;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    server {
        listen 80;
        server_name _;

        # redirecionamento relativo: atrás do proxy do Coolify (HTTPS) o nginx recebe HTTP e, absoluto,
        # mandaria o navegador para http://
        absolute_redirect off;

        root /usr/share/nginx/html/frontend/browser;
        index index.html;

        # DNS interno do Docker: o nome "backend" é resolvido a cada requisição,
        # assim o nginx sobe mesmo se o backend ainda estiver iniciando.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;

        # HU08: stream SSE — sem buffer e com timeout longo
        location /h2gas-api/api/sse {
            rewrite ^/h2gas-api/(.*)$ /h2gas/$1 break;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # mesmo domínio para o navegador e a API: sem Origin, o Spring não trata
            # a chamada como CORS (a lista de origens do backend não tem o domínio do Coolify)
            proxy_set_header Origin "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # /h2gas-api/api/... -> backend:8080/h2gas/api/...
        location /h2gas-api/ {
            rewrite ^/h2gas-api/(.*)$ /h2gas/$1 break;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # mesmo domínio para o navegador e a API: sem Origin, o Spring não trata
            # a chamada como CORS (a lista de origens do backend não tem o domínio do Coolify)
            proxy_set_header Origin "";
            proxy_read_timeout 60s;
        }

        # atalho curto para a documentação da API
        location = /swagger {
            return 302 /h2gas-api/swagger-ui.html;
        }
        location = /swagger/ {
            return 302 /h2gas-api/swagger-ui.html;
        }

        # /h2gas/... direto para o backend (sem reescrita): é o endereço que o Swagger gera para o
        # "Try it out" (servidor = https://<domínio>/h2gas). O app usa /h2gas-api/.
        location /h2gas/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Origin "";
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}
