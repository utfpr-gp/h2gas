spring.application.name=backend

server.servlet.context-path=/h2gas

#spring-boot-starter-mail properties
spring.mail.host=smtp.gmail.com
#porta SMTP com suporte a TLS
spring.mail.port=587
#credenciais do servidor SMTP
spring.mail.username=${USER_NAME}
spring.mail.password=${PASSWORD_EMAIL}
frontend.url=${FRONTEND_URL_DEV}

#diretório em que ficaram os logs e outros recursos externos a aplicação
java.external.resources=/java-external-resources

#propriedades do JavaMail
#exige autenticação para envio
spring.mail.properties.mail.smtp.auth=true
#habilita o uso de conexão TLS
spring.mail.properties.mail.smtp.starttls.enable=true
#assegura que TLS deve ser usado ou então nada é enviado
spring.mail.properties.mail.smtp.starttls.required=true
#se desabilitado, não testa a conexão com o servidor de email no startup da aplicação
spring.mail.test-connection=false

#problema com antivirus, avast, desabilitar ou ativar a linha debaixo para enviar email
#spring.mail.properties.mail.smtp.ssl.trust=*

support.mail=pablocorreia2012@gmail.com

#senha utilizada para assinatura digital do token
#usado para validar o token
#jwt.secret=_0l2EAS1234_
jwt.secret=${JWT_SECRET}

#api.security.token.secret
#token com dura 7 dias 604800
jwt.expiration=604800

hashid.salt = _asdwerwerf_

#keys do recaptcha
google.recaptcha.site.key = KEY
google.recaptcha.secret.key = KEY
google.recaptcha.verify.url=https://www.google.com/recaptcha/api/siteverify


# Available levels are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
logging.level.root = INFO
logging.level.org.springframework.web= INFO
#logging.level.org.hibernate: ERROR
#habilita a persistncia em arquivo - útil para sistema em produção
logging.file.name=${java.external.resources}/logs/h2gas.log

#Tamanho dos arquivos de upload de imagem suportado (banner da loja: 2 MB; a logo segue validada em 1 MB no service)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.location=${java.io.tmpdir}
server.tomcat.max-swallow-size=-1

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

#********************************
# Email.
#********************************
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.verify.service.sid=${TWILIO_VERIFY_SERVICE_SID}

#cloudnary
cloudinary.url=${CLOUDINARY_URL}

#********************************
# configura as variaveis de ambiente
#********************************
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=dev
