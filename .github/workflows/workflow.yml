name: Continuous Integration
on: pull_request

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java: [17]
    name: Run unit tests on Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
#        run: mvn -f backend/pom.xml clean test
        env:
            SPRING_PROFILES_ACTIVE: test
         run: mvn -f backend/pom.xml clean install -DskipTests=false -Dspring.profiles.active=test -e -X

#        run: mvn -f backend/pom.xml clean test -Dspring.profiles.active=test -e -X



      - name: Show test error logs
        if: failure()
        run: |
          echo ">>> Test Error Logs:"
          find backend/target/surefire-reports -name "*.txt" -exec cat {} \; || true

