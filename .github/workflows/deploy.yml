name: Build, Push e Deploy

on:
  push:
    tags:
      - 'v*.*.*'  # dispara quando criar uma tag

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: |
          docker build -t pabloc5/h2gas-backend:${GITHUB_REF_NAME#refs/tags/} ./backend
          docker push pabloc5/h2gas-backend:${GITHUB_REF_NAME#refs/tags/}

      - name: Build frontend
        run: |
          docker build -t pabloc5/h2gas-frontend:${GITHUB_REF_NAME#refs/tags/} ./frontend
          docker push pabloc5/h2gas-frontend:${GITHUB_REF_NAME#refs/tags/}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na AWS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          env:
            TAG: ${{ github.ref_name }}
          script: |
            cd /home/ubuntu/h2gas
            sed -i "s|image: pabloc5/h2gas-backend:.*|image: pabloc5/h2gas-backend:$TAG|" docker-compose.prod.yml
            sed -i "s|image: pabloc5/h2gas-frontend:.*|image: pabloc5/h2gas-frontend:$TAG|" docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

