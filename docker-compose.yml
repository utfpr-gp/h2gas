version: '3.8'
services:
  db:
    image: mysql:5.7
    container_name: h2gas-database
    restart: always
    #se houver o arquivo .env, a seção environment não é executada
    env_file:
      - .env
    #se o .env não for encontrado, em produção, usará estas variáveis esperadas pela imagem do MySQL
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE} #cria o database ao iniciar o container
    volumes:
      - ./data:/var/lib/mysql
    ports:
      - '3307:3306'
  backend:
#    image: ronifabio/h2gas-backend:latest
    container_name: h2gas-backend
    build: ./backend
    ports:
      - '8080:8080'
    env_file:
      - .env
    restart: always
    environment:
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      #acessa o banco de dados via rede interna (bridge network) criado
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/h2gas_db?useSSL=false&serverTimezone=UTC
#      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER_B}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
